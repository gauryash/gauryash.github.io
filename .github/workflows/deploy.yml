name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp index.html _site/404.html
          cp styles.css script.js favicon.svg _site/
          cp -R posts _site/posts
          cp references.md _site/references.md
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          site = Path('_site')
          for route in ('home', 'work', 'wiki', 'reading'):
              target = site / route / 'index.html'
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(site / 'index.html', target)

          posts = json.loads((site / 'posts' / 'index.json').read_text())
          for post in posts:
              target = site / 'wiki' / post['slug'] / 'index.html'
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(site / 'index.html', target)
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
